# Dry-run the release flow against the shared TEST distribution repo
# (braintrustdata/test-coding-agent-dist). Same dropdowns as release.yml.
#
# Exercises the version bump, build, and deploy, but deploys to the test repo
# and does NOT commit/tag/release on the monorepo — so it leaves no trace and
# can be re-run with the same version. Use release.yml for a real release.

name: Release plugin (test)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v0.0.4"
        required: true
        type: string
      plugin:
        description: "Plugin bundle to release"
        required: true
        type: choice
        options: [claude, codex]

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      version: ${{ inputs.version }}
      plugin: ${{ inputs.plugin }}
      dist_repo: braintrustdata/test-coding-agent-dist
      record: false
    secrets: inherit

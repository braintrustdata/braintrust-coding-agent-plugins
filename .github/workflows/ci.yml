name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  plugins:
    name: Plugin packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.21.0
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            src/plugins/opencode/content/pnpm-lock.yaml
            src/plugins/pi/content/pnpm-lock.yaml
      - name: Reject Bun tooling in OpenCode and the shared client
        shell: bash
        run: |
          if git grep -n -E 'bun:test|bun run|bun install|packageManager.*bun' -- \
            src/plugins/opencode/content src/runtime/js-daemon-client; then
            echo "OpenCode or the shared daemon client still depends on Bun" >&2
            exit 1
          fi
          if find src/plugins/opencode -name 'bun.lock*' -print -quit | grep -q .; then
            echo "OpenCode still contains a Bun lockfile" >&2
            exit 1
          fi
      # Each plugin writes only to its own dist/<plugin> directory.
      - parallel:
          - name: Build Antigravity package
            run: make build-antigravity
          - name: Build Claude package
            run: make build-claude
          - name: Build Codex package
            run: make build-codex
          - name: Build Cursor package
            run: make build-cursor
          - name: Build Grok package
            run: make build-grok
      # Validation and the Cursor extension build read independent artifacts.
      - parallel:
          - name: Validate Antigravity package
            run: src/plugins/antigravity/validate.sh dist/antigravity
          - name: Validate Claude package
            run: src/plugins/claude/validate.sh dist/claude
          - name: Validate Codex package
            run: src/plugins/codex/validate.sh dist/codex
          - name: Validate Cursor package
            run: src/plugins/cursor/validate.sh dist/cursor
          - name: Validate Grok package
            run: src/plugins/grok/validate.sh dist/grok
          - name: Build Cursor extension
            working-directory: dist/cursor
            run: |
              npm ci --ignore-scripts --no-audit --no-fund
              npm run build

  # Pi and OpenCode run inside the user's agent process, so their unit tests
  # run on every host OS. Packaging and validation stay in `plugins`.
  js-packages:
    name: JavaScript packages (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.21.0
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            src/plugins/opencode/content/pnpm-lock.yaml
            src/plugins/pi/content/pnpm-lock.yaml
      - name: Prepare and verify generated client copies
        run: |
          node scripts/prepare-js-daemon-client.mjs all
          node scripts/prepare-js-daemon-client.mjs all --check
      # Package installs write to separate node_modules trees. The RPC
      # contract tests are read-only, so these checks can share the runner.
      - parallel:
          - name: Test RPC transport contracts
            run: node --test src/runtime/js-daemon-client/tests/client.test.ts
          - name: Test Pi package
            shell: bash
            working-directory: src/plugins/pi/content
            run: |
              pnpm install --frozen-lockfile
              pnpm test
          - name: Test OpenCode package
            if: ${{ !cancelled() }}
            shell: bash
            working-directory: src/plugins/opencode/content
            run: |
              pnpm install --frozen-lockfile
              pnpm test
      - name: Lint shared daemon client
        shell: bash
        working-directory: src/runtime/js-daemon-client
        run: ../../plugins/opencode/content/node_modules/.bin/vp lint --config .oxlintrc.json src
      # Match the native daemon job: compiling/linking the console probe in
      # the default C: temp directory can stall under Defender scanning.
      - name: Set up Windows Dev Drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 12GB
          mount-path: ${{ github.workspace }}/.devdrive
          trusted-dev-drive: true
          env-mapping: |
            TMP,{{ DEV_DRIVE }}/tmp
            TEMP,{{ DEV_DRIVE }}/tmp
      - name: Create Dev Drive temp directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
      - name: Install Rust for native Windows console probes
        if: runner.os == 'Windows'
        run: rustup default stable
      - name: Verify JavaScript background launches have no Windows console
        if: runner.os == 'Windows'
        run: node scripts/tests/windows-background-process.mjs

  opencode-compatibility:
    name: OpenCode package (${{ matrix.peer-version }})
    strategy:
      fail-fast: false
      matrix:
        peer-version: ["1.2.25", "latest"]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.21.0
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/plugins/opencode/content/pnpm-lock.yaml
      # `plugins` validates the package once; this job only checks the
      # packed tarball against each supported OpenCode peer.
      - name: Build package
        run: make build-opencode
      - name: Install package with OpenCode peers
        env:
          PEER_VERSION: ${{ matrix.peer-version }}
        run: |
          set -euo pipefail
          package_dir="$(mktemp -d)"
          (cd dist/opencode && pnpm pack --pack-destination "$package_dir" >/dev/null)
          tarball="$(find "$package_dir" -name 'braintrust-trace-opencode-*.tgz' -print -quit)"
          mkdir install-test
          npm install --prefix install-test --no-audit --no-fund \
            "$tarball" \
            "@opencode-ai/plugin@${PEER_VERSION}" \
            "@opencode-ai/sdk@${PEER_VERSION}"
          node -e 'import(process.argv[1]).then((m) => { if (typeof m.default !== "function") process.exit(1) })' \
            "$PWD/install-test/node_modules/@braintrust/trace-opencode/dist/index.mjs"

  resolve-pi-compatibility:
    name: Resolve Pi compatibility window
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
      latest: ${{ steps.versions.outputs.latest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - id: versions
        name: Resolve latest patch from five Pi minor lines
        env:
          PI_VERSION_COUNT: 5
        run: node src/plugins/pi/content/scripts/resolve-pi-versions.mjs

  pi-compatibility:
    name: Pi package (${{ matrix.pi-target.version }})
    needs: resolve-pi-compatibility
    strategy:
      fail-fast: false
      matrix:
        pi-target: ${{ fromJson(needs.resolve-pi-compatibility.outputs.versions) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.21.0
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/plugins/pi/content/pnpm-lock.yaml
      # `plugins` validates the package once. This job runs a real Pi session
      # with the packed extension against each Pi release line, so a Pi
      # release that breaks tracing fails here rather than only at import.
      - name: Build Pi package
        run: make build-pi
      - name: Install packed extension with resolved Pi
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$(mktemp -d)"
          (cd dist/pi && pnpm pack --pack-destination "$package_dir" >/dev/null)
          tarball="$(find "$package_dir" -name 'braintrust-pi-extension-*.tgz' -print -quit)"
          npm install --prefix "$RUNNER_TEMP/pi-install-test" --no-audit --no-fund \
            "$tarball" \
            '${{ matrix.pi-target.piCodingAgentSpec }}'
          "$RUNNER_TEMP/pi-install-test/node_modules/.bin/pi" --version
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # One cache for every Pi target; pushes to main refresh it from the
      # latest target and PRs restore it.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: bt-daemon -> target
          shared-key: pi-compatibility
          save-if: ${{ github.event_name != 'pull_request' && matrix.pi-target.version == needs.resolve-pi-compatibility.outputs.latest }}
      - name: Trace a Pi session with deterministic inference
        env:
          BT_AGENT_INFERENCE_MODE: mock
          BT_AGENT_INGEST_MODE: mock
          PI_BIN: ${{ runner.temp }}/pi-install-test/node_modules/.bin/pi
          PI_EXTENSION_PATH: ${{ runner.temp }}/pi-install-test/node_modules/@braintrust/pi-extension/dist/index.mjs
        run: cargo test --manifest-path bt-daemon/Cargo.toml --all-features --locked --test agent_integration pi_session_emits_traces -- --ignored --nocapture --exact

  resolve-coding-agent-versions:
    name: Resolve coding-agent versions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      codex: ${{ steps.versions.outputs.codex }}
      claude: ${{ steps.versions.outputs.claude }}
      opencode: ${{ steps.versions.outputs.opencode }}
      pi: ${{ steps.versions.outputs.pi }}
    steps:
      - id: versions
        name: Resolve latest coding-agent versions
        run: |
          set -euo pipefail
          echo "codex=$(npm view @openai/codex version)" >> "$GITHUB_OUTPUT"
          echo "claude=$(npm view @anthropic-ai/claude-code version)" >> "$GITHUB_OUTPUT"
          echo "opencode=$(npm view opencode-ai version)" >> "$GITHUB_OUTPUT"
          echo "pi=$(npm view @earendil-works/pi-coding-agent version)" >> "$GITHUB_OUTPUT"

  daemon:
    name: Daemon (${{ matrix.os }})
    needs: resolve-coding-agent-versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            agent_suffix: ""
          - os: macos-26
            agent_suffix: ""
          - os: windows-2025
            agent_suffix: ".cmd"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Defender scanning of C: dominates Windows compile and agent I/O time.
      # Keep the Cargo target and temp directories on a trusted ReFS Dev Drive.
      - name: Set up Windows Dev Drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 12GB
          mount-path: ${{ github.workspace }}/.devdrive
          trusted-dev-drive: true
          env-mapping: |
            CARGO_TARGET_DIR,{{ DEV_DRIVE }}/target
            TMP,{{ DEV_DRIVE }}/tmp
            TEMP,{{ DEV_DRIVE }}/tmp
      - name: Create Dev Drive temp directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
      # Rust and agent CLI installs use separate toolchains and directories.
      - parallel:
          - name: Install Rust
            run: |
              rustup toolchain install stable --profile minimal
              rustup default stable
              rustup component add clippy rustfmt
          - name: Install resolved coding agents
            shell: bash
            run: |
              npm install --prefix "${{ runner.temp }}/coding-agents" \
                --no-save --no-package-lock --no-audit --no-fund \
                --cache "${{ runner.temp }}/npm-cache" \
                "@openai/codex@${{ needs.resolve-coding-agent-versions.outputs.codex }}" \
                "@anthropic-ai/claude-code@${{ needs.resolve-coding-agent-versions.outputs.claude }}" \
                "opencode-ai@${{ needs.resolve-coding-agent-versions.outputs.opencode }}" \
                "@earendil-works/pi-coding-agent@${{ needs.resolve-coding-agent-versions.outputs.pi }}"
      # PRs restore main's cache; pushes to main and manual runs refresh it.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ runner.os == 'Windows' && 'bt-daemon -> ../.devdrive/target' || 'bt-daemon -> target' }}
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Ensure Codex platform binary is available
        shell: bash
        run: |
          set -euo pipefail
          agent_dir="${{ runner.temp }}/coding-agents"
          codex_version="$(node -p 'require(process.argv[1]).version' "$(npm root --prefix "$agent_dir")/@openai/codex/package.json")"
          codex_platform="$(node -p '`${process.platform}-${process.arch}`')"
          platform_dir="$agent_dir/node_modules/@openai/codex-$codex_platform"
          platform_spec="@openai/codex-$codex_platform@npm:@openai/codex@$codex_version-$codex_platform"
          if test -d "$platform_dir"; then
            exit 0
          fi
          for attempt in 1 2 3 4 5 6; do
            if npm install --prefix "$agent_dir" --no-save --no-package-lock --no-audit --no-fund \
              --cache "${{ runner.temp }}/npm-cache" \
              "@openai/codex@$codex_version" "$platform_spec" \
              "@anthropic-ai/claude-code@${{ needs.resolve-coding-agent-versions.outputs.claude }}" \
              "opencode-ai@${{ needs.resolve-coding-agent-versions.outputs.opencode }}" \
              "@earendil-works/pi-coding-agent@${{ needs.resolve-coding-agent-versions.outputs.pi }}"; then
              exit 0
            fi
            if test "$attempt" = 6; then
              echo "Codex platform package remained unavailable: $platform_spec" >&2
              exit 1
            fi
            sleep 10
          done
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.21.0
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            src/plugins/opencode/content/pnpm-lock.yaml
            src/plugins/pi/content/pnpm-lock.yaml
      - name: Build and install OpenCode plugin for integration harness
        shell: bash
        run: |
          set -euo pipefail
          make build-opencode
          package_dir="$RUNNER_TEMP/opencode-package"
          install_dir="$RUNNER_TEMP/opencode-plugin-install"
          mkdir -p "$package_dir" "$install_dir"
          (cd dist/opencode && pnpm pack --pack-destination "$package_dir" >/dev/null)
          tarball="$(find "$package_dir" -name 'braintrust-trace-opencode-*.tgz' -print -quit)"
          npm install --prefix "$install_dir" --no-audit --no-fund \
            "$tarball" @opencode-ai/plugin@latest @opencode-ai/sdk@latest
          echo "OPENCODE_PLUGIN=$install_dir/node_modules/@braintrust/trace-opencode/dist/index.mjs" \
            >> "$GITHUB_ENV"
      - name: Build and install Pi extension for integration harness
        shell: bash
        run: |
          set -euo pipefail
          make build-pi
          package_dir="$RUNNER_TEMP/pi-package"
          install_dir="$RUNNER_TEMP/pi-extension"
          mkdir -p "$package_dir" "$install_dir"
          (cd dist/pi && pnpm pack --pack-destination "$package_dir" >/dev/null)
          tarball="$(find "$package_dir" -name 'braintrust-pi-extension-*.tgz' -print -quit)"
          npm install --prefix "$install_dir" --no-save --no-package-lock --no-audit --no-fund \
            "$tarball"
      - name: Report coding-agent versions
        run: |
          npm exec --prefix "${{ runner.temp }}/coding-agents" -- codex --version
          npm exec --prefix "${{ runner.temp }}/coding-agents" -- claude --version
          npm exec --prefix "${{ runner.temp }}/coding-agents" -- opencode --version
          npm exec --prefix "${{ runner.temp }}/coding-agents" -- pi --version
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path bt-daemon/Cargo.toml -- --check
      - name: Build daemon
        run: cargo build --manifest-path bt-daemon/Cargo.toml --all-features --locked
      - name: Test daemon
        run: cargo test --manifest-path bt-daemon/Cargo.toml --all-features --locked
      - name: Test coding-agent integrations with deterministic inference
        env:
          BT_AGENT_INFERENCE_MODE: mock
          BT_AGENT_INGEST_MODE: mock
          CODEX_BIN: ${{ runner.temp }}/coding-agents/node_modules/.bin/codex${{ matrix.agent_suffix }}
          CLAUDE_BIN: ${{ runner.temp }}/coding-agents/node_modules/.bin/claude${{ matrix.agent_suffix }}
          OPENCODE_BIN: ${{ runner.temp }}/coding-agents/node_modules/.bin/opencode${{ matrix.agent_suffix }}
          PI_BIN: ${{ runner.temp }}/coding-agents/node_modules/.bin/pi${{ matrix.agent_suffix }}
          PI_EXTENSION_PATH: ${{ runner.temp }}/pi-extension/node_modules/@braintrust/pi-extension/dist/index.mjs
        run: cargo test --manifest-path bt-daemon/Cargo.toml --all-features --locked --test agent_integration -- --ignored --nocapture --test-threads=1
      # macOS has no cfg-specific code beyond the unix paths linted on Linux.
      - name: Lint daemon
        if: runner.os != 'macOS'
        run: cargo clippy --manifest-path bt-daemon/Cargo.toml --all-targets --all-features --locked -- -D warnings

  checks-passed:
    name: checks-passed
    needs:
      - plugins
      - js-packages
      - opencode-compatibility
      - resolve-pi-compatibility
      - pi-compatibility
      - resolve-coding-agent-versions
      - daemon
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    steps:
      - name: Verify all required checks passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=0
          while IFS=$'\t' read -r job result; do
            if [ "$result" != "success" ]; then
              echo "Job '$job' finished with result: $result"
              failed=1
            fi
          done < <(jq -r 'to_entries[] | [.key, .value.result] | @tsv' <<< "$NEEDS")

          if [ "$failed" -ne 0 ]; then
            echo "One or more required checks failed or were skipped"
            exit 1
          fi

          echo "All required checks passed"

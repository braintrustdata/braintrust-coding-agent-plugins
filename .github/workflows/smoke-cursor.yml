# Install the generated Cursor artifact and run a real headless CLI session
# through its hooks into the monorepo daemon and a local mock Braintrust sink.
name: Smoke (cursor)

on:
  workflow_call:
    inputs:
      dist_repo:
        required: true
        type: string
    secrets:
      BRAINTRUST_BOT_APP_ID:
        required: true
      BRAINTRUST_BOT_PRIVATE_KEY:
        required: true
      CURSOR_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      dist_repo:
        description: "Distribution repo to install from (owner/name)."
        required: true
        type: string
        default: braintrustdata/test-coding-agent-dist

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    outputs:
      has_key: ${{ steps.check.outputs.has_key }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CURSOR_API_KEY not set; skipping Cursor smoke test."
          fi

  smoke:
    needs: guard
    if: needs.guard.outputs.has_key == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate distribution repository
        id: dist
        env:
          DIST_REPO: ${{ inputs.dist_repo }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$DIST_REPO" | grep -Eq '^[^/[:space:]]+/[^/[:space:]]+$'; then
            echo "::error::dist_repo '$DIST_REPO' must be owner/name."; exit 1
          fi
          echo "owner=${DIST_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${DIST_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Set up Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          agent --version

      - name: Generate distribution-repo token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BRAINTRUST_BOT_APP_ID }}
          private-key: ${{ secrets.BRAINTRUST_BOT_PRIVATE_KEY }}
          owner: ${{ steps.dist.outputs.owner }}
          repositories: ${{ steps.dist.outputs.name }}
          permission-contents: read

      - name: Install generated plugin artifact
        env:
          DIST_REPO: ${{ inputs.dist_repo }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/$DIST_REPO.git" "${RUNNER_TEMP}/cursor-plugin"
          mkdir -p "$HOME/.cursor/plugins/local/trace-cursor"
          cp -R "${RUNNER_TEMP}/cursor-plugin/." "$HOME/.cursor/plugins/local/trace-cursor/"
          python3 - "$HOME/.cursor/plugins/local/trace-cursor" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          manifest = json.loads((root / '.cursor-plugin/plugin.json').read_text())
          assert manifest['name'] == 'trace-cursor', manifest
          assert (root / 'hooks/hooks.json').is_file()
          PY
          mkdir -p "${RUNNER_TEMP}/cursor-smoke/.cursor"
          cat > "${RUNNER_TEMP}/cursor-smoke/.cursor/hooks.json" <<'JSON'
          {"version":1,"hooks":{"beforeSubmitPrompt":[{"command":"printf '%s\\n' '{\"continue\":true}'"}],"afterAgentResponse":[{"command":"printf '%s\\n' '{}'"}],"stop":[{"command":"printf '%s\\n' '{}'"}]}}
          JSON

      - name: Run a real traced Cursor session
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          BT_DAEMON_CONFIG: ${{ runner.temp }}/bt-daemon-config.json
          BT_DAEMON_SOCKET: ${{ runner.temp }}/cursor-daemon.sock
          BT_DAEMON_BIN: ${{ github.workspace }}/bt-daemon/target/debug/bt-daemon
          BT_BIN: ${{ github.workspace }}/src/plugins/cursor/test/bt-standalone-wrapper.sh
          BRAINTRUST_API_KEY: smoke-key
          BRAINTRUST_API_URL: http://127.0.0.1:53999
          BRAINTRUST_APP_URL: http://127.0.0.1:53999
          MOCK_COLLECTOR_OUT: ${{ runner.temp }}/mock-summary.json
        run: |
          set -euo pipefail
          cargo build --manifest-path bt-daemon/Cargo.toml --features cli
          mkdir -p "${RUNNER_TEMP}/cursor-bin"
          install -m 755 "$BT_BIN" "${RUNNER_TEMP}/cursor-bin/bt"
          export PATH="${RUNNER_TEMP}/cursor-bin:$PATH"
          printf '%s\n' '{"trace_to_braintrust":true,"route":{"destination":{"type":"project_logs","project_name":"trace-cursor-smoke"},"flush_mode":"flush_on_turn_end"}}' > "$BT_DAEMON_CONFIG"
          python3 .github/scripts/mock-braintrust.py > "${RUNNER_TEMP}/mock-collector.log" 2>&1 &
          collector_pid=$!
          trap 'kill "$collector_pid" 2>/dev/null || true' EXIT
          "$BT_DAEMON_BIN" serve --socket "$BT_DAEMON_SOCKET" --data-dir "${RUNNER_TEMP}/cursor-state" --idle-timeout-secs 0 &
          daemon_pid=$!
          trap 'kill "$daemon_pid" "$collector_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            curl -fsS http://127.0.0.1:53999/version >/dev/null && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:53999/version >/dev/null
          cd "${RUNNER_TEMP}/cursor-smoke"
          export CURSOR_PLUGIN_DIR="$HOME/.cursor/plugins/local/trace-cursor"
          python3 "${GITHUB_WORKSPACE}/.github/scripts/run-cursor-interactive-smoke.py"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          summary = json.loads(Path(os.environ["MOCK_COLLECTOR_OUT"]).read_text())
          rows = summary["rows"]
          assert any(
              (row.get("span_attributes") or {}).get("type") == "task"
              and ((row.get("span_attributes") or {}).get("name") or "").startswith("Turn ")
              for row in rows
          ), summary
          assert any(
              (row.get("span_attributes") or {}).get("type") == "llm"
              and "cursor tracing smoke test passed" in json.dumps(row.get("output")).lower()
              for row in rows
          ), summary
          print({"logs3Requests": summary["logs3Requests"], "totalRows": summary["totalRows"]})
          PY

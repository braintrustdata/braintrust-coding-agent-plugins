name: Set up Node and pnpm
description: Install the Node and pnpm versions pinned in the root .tool-versions.
inputs:
  cache-dependency-path:
    description: pnpm lockfile(s) whose contents key the pnpm store cache.
    required: true
runs:
  using: composite
  steps:
    # pnpm/action-setup cannot read .tool-versions, so resolve the version here.
    - name: Read pnpm version
      id: versions
      shell: bash
      run: |
        pnpm_version="$(awk '$1 == "pnpm" { print $2 }' "$GITHUB_WORKSPACE/.tool-versions")"
        if [ -z "$pnpm_version" ]; then
          echo "::error file=.tool-versions::missing pnpm entry"
          exit 1
        fi
        echo "pnpm=$pnpm_version" >> "$GITHUB_OUTPUT"
    - name: Set up pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      with:
        version: ${{ steps.versions.outputs.pnpm }}
    - name: Set up Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: .tool-versions
        cache: pnpm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
    # pnpm switches to each package's packageManager version, so keep those
    # in sync with the pin.
    - name: Check packageManager matches .tool-versions
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        EXPECTED: pnpm@${{ steps.versions.outputs.pnpm }}
      run: |
        status=0
        for manifest in src/plugins/opencode/content/package.json src/plugins/pi/content/package.json; do
          actual="$(node -p 'require(process.argv[1]).packageManager' "$PWD/$manifest")"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error file=$manifest::packageManager is $actual; .tool-versions pins $EXPECTED"
            status=1
          fi
        done
        exit "$status"
